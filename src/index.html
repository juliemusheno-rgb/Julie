<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Family Recipe Book</title>
<!-- Home-screen / standalone (iPad & iPhone "Add to Home Screen") -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipe Book">
<meta name="theme-color" content="#2B2F27">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Fonts are loaded from Google when online; the app still works offline with
     graceful serif/sans-serif fallbacks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Floating menu button + backdrop (narrow screens) -->
<button class="nav-toggle" id="navToggle">&#9776; Recipes</button>
<div class="nav-backdrop" id="navBackdrop"></div>

<!-- Sidebar (chapters + recipes) — generated by app.js -->
<nav class="nav" id="sidebar"></nav>

<!-- Toolbar: search, filter, actions -->
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap" id="searchWrap">
      <span class="ic">&#9906;</span>
      <input type="text" id="searchInput" placeholder="Search recipes, ingredients, sources…" autocomplete="off" spellcheck="false">
      <button class="clear" id="searchClear" title="Clear search">&times;</button>
    </div>
    <select id="categoryFilter" title="Filter by chapter"></select>
    <a class="tb-btn" href="dashboard.html" title="Open the recipe dashboard">&#9881; Dashboard</a>
    <button class="tb-btn primary" id="addBtn">+ Add Recipe</button>
    <div class="tb-menu" id="moreMenu">
      <button class="tb-btn" id="moreBtn">More &#9662;</button>
      <div class="menu-pop">
        <button id="printBtn">Print / Save as PDF</button>
        <div class="sep"></div>
        <button id="exportBtn">Export recipes (.json)</button>
        <button id="importBtn">Import recipes (.json)</button>
        <div class="sep"></div>
        <button id="resetBtn" class="danger">Restore original recipes</button>
      </div>
    </div>
  </div>
</div>

<!-- Page stack — generated by app.js -->
<div class="stage" id="stage"></div>

<!-- Hidden file input for import -->
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<!-- The editor modal is injected by editor.js (shared with the dashboard). -->

<script src="recipes.seed.js"></script>
<script src="store.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
