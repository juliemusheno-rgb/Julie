<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Family Recipe Book</title>
<!-- Fonts are loaded from Google when online; the app still works offline with
     graceful serif/sans-serif fallbacks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Floating menu button + backdrop (narrow screens) -->
<button class="nav-toggle" id="navToggle">&#9776; Recipes</button>
<div class="nav-backdrop" id="navBackdrop"></div>

<!-- Sidebar (chapters + recipes) — generated by app.js -->
<nav class="nav" id="sidebar"></nav>

<!-- Toolbar: search, filter, actions -->
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap" id="searchWrap">
      <span class="ic">&#9906;</span>
      <input type="text" id="searchInput" placeholder="Search recipes, ingredients, sources…" autocomplete="off" spellcheck="false">
      <button class="clear" id="searchClear" title="Clear search">&times;</button>
    </div>
    <select id="categoryFilter" title="Filter by chapter"></select>
    <button class="tb-btn primary" id="addBtn">+ Add Recipe</button>
    <div class="tb-menu" id="moreMenu">
      <button class="tb-btn" id="moreBtn">More &#9662;</button>
      <div class="menu-pop">
        <button id="printBtn">Print / Save as PDF</button>
        <div class="sep"></div>
        <button id="exportBtn">Export recipes (.json)</button>
        <button id="importBtn">Import recipes (.json)</button>
        <div class="sep"></div>
        <button id="resetBtn" class="danger">Restore original recipes</button>
      </div>
    </div>
  </div>
</div>

<!-- Page stack — generated by app.js -->
<div class="stage" id="stage"></div>

<!-- Hidden file input for import -->
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<!-- Editor modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">Add Recipe</h2>
      <button class="x" id="modalClose" title="Close">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f_id">

      <div class="field">
        <label for="f_title">Title</label>
        <input type="text" id="f_title" placeholder="e.g. Grandma's Apple Pie">
      </div>

      <div class="two-col">
        <div class="field">
          <label for="f_category">Chapter</label>
          <div class="cat-row">
            <select id="f_category"></select>
          </div>
          <input type="text" id="f_categoryNew" placeholder="…or type a new chapter" style="margin-top:8px;display:none;">
          <div class="hint">Pick a chapter, or choose "New chapter…" to create one.</div>
        </div>
        <div class="field">
          <label for="f_source">Source / credit <span style="text-transform:none;letter-spacing:0;color:var(--ink-soft);font-weight:400;">(optional)</span></label>
          <input type="text" id="f_source" placeholder="e.g. adapted from allrecipes.com">
        </div>
      </div>

      <div class="field">
        <label for="f_story">Story <span style="text-transform:none;color:var(--ink-soft);font-weight:400;">(optional)</span></label>
        <textarea id="f_story" rows="2" placeholder="A line or two about this dish…"></textarea>
      </div>

      <div class="field">
        <label>Details <span style="text-transform:none;color:var(--ink-soft);font-weight:400;">(yields, prep, bake, etc.)</span></label>
        <div class="meta-rows" id="metaRows"></div>
        <button type="button" class="add-link" id="addMetaBtn">+ Add detail</button>
      </div>

      <div class="field">
        <label>Ingredients</label>
        <div id="ingGroups"></div>
        <button type="button" class="add-link" id="addGroupBtn">+ Add ingredient group</button>
        <div class="hint">One ingredient per line. Add extra groups for multi-part recipes (e.g. "Sauce", "Topping").</div>
      </div>

      <div class="field">
        <label for="f_steps">Directions</label>
        <textarea id="f_steps" rows="7" placeholder="One step per line. They'll be numbered automatically."></textarea>
        <div class="hint">One step per line — numbering is added for you.</div>
      </div>

      <div class="field">
        <label for="f_note">Note <span style="text-transform:none;color:var(--ink-soft);font-weight:400;">(optional)</span></label>
        <textarea id="f_note" rows="2" placeholder="Make-ahead tips, substitutions, etc."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="deleteBtn" style="display:none;">Delete</button>
      <div class="right">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save recipe</button>
      </div>
    </div>
  </div>
</div>

<script src="recipes.seed.js"></script>
<script src="app.js"></script>
</body>
</html>
